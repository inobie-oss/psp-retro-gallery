name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - run: psp-pacman -Syu --noconfirm sdl2 sdl2_image libpng libjpeg-turbo zlib
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: RetroGallery
          path: EBOOT.PBP
